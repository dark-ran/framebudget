<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameBudget Bench</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px/1.6 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 8px; left: 8px; z-index: 10; padding: 6px 10px; border-radius: 6px;
         background: rgba(0, 0, 0, .75); color: #eee; font: 12px/1.6 ui-monospace, monospace; }
  #hud a { color: #8cf; margin-right: 8px; }
  .static { height: 100%; overflow: auto; box-sizing: border-box; padding: 48px 12vw; background: #fafafa; color: #222; }
  .stage { position: fixed; inset: 0; }
  .box { position: absolute; width: 36px; height: 36px; border-radius: 8px; }
  /* 컴포지터 스레드에서 처리되는 애니메이션 */
  .spin { animation: spin 2s linear infinite; }
  /* 매 프레임 메인 스레드 페인트가 필요한 애니메이션 */
  .glow { animation: glow 1.2s ease-in-out infinite alternate; }
  @keyframes spin { to { transform: rotate(360deg) translateX(24px); } }
  @keyframes glow { from { box-shadow: 0 0 2px 0 #f80; background-color: #345; }
                    to   { box-shadow: 0 0 10px 2px #0cf; background-color: #a53; } }
</style>
</head>
<body>
<script>
const P = new URLSearchParams(location.search);
const scene = P.get('scene') || 'webgl';
const cap = Number(P.get('cap')) || 0;
const warmupMs = Number(P.get('warmup') ?? 5) * 1000;
const durationMs = Number(P.get('duration') ?? 30) * 1000;
const run = P.get('run');            // 하네스(bench.py)가 붙이는 실행 ID. 없으면 수동 관찰 모드
const showHud = P.get('hud') !== '0';

// 결정적 난수: 조건이 달라도 같은 장면이 그려지도록 고정 시드 사용
let seed = 12345;
const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

const nativeRAF = window.requestAnimationFrame.bind(window);

// cap > 0: 확장 프로그램 수준의 제한을 흉내 낸다.
// 페이지의 rAF 콜백만 cap FPS로 솎아내고, 브라우저 자체의 프레임 생성은 모니터 주사율 그대로 둔다.
if (cap > 0) {
  const interval = 1000 / cap;
  let last = -Infinity;
  window.requestAnimationFrame = cb => nativeRAF(function tick(t) {
    if (t - last >= interval - 4) { last = t; cb(t); } else nativeRAF(tick);
  });
}

// ---- 프레임 기록 ----
const stamps = [];
let measuring = !run;
let hudFrames = 0;
function frame(t) {
  if (measuring && run) stamps.push(t);
  hudFrames++;
}

function percentile(sorted, p) {
  if (!sorted.length) return null;
  return sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))];
}

function summarize(elapsedMs) {
  const intervals = stamps.slice(1).map((t, i) => t - stamps[i]).sort((a, b) => a - b);
  const r = v => v == null ? null : Math.round(v * 100) / 100;
  return {
    scene, cap,
    frames: stamps.length,
    elapsed_s: r(elapsedMs / 1000),
    fps: r(stamps.length / (elapsedMs / 1000)),
    interval_p50_ms: r(percentile(intervals, 0.5)),
    interval_p95_ms: r(percentile(intervals, 0.95)),
    dpr: devicePixelRatio,
    viewport: `${innerWidth}x${innerHeight}`,
    ua: navigator.userAgent,
  };
}

function post(kind, data) {
  if (!run) return;
  fetch(`/${kind}?run=${run}`, { method: 'POST', body: JSON.stringify(data), keepalive: true });
}

if (run) {
  setTimeout(() => {
    stamps.length = 0;
    measuring = true;
    const t0 = performance.now();
    post('begin', {});
    setTimeout(() => {
      measuring = false;
      post('result', summarize(performance.now() - t0));
    }, durationMs);
  }, warmupMs);
}

// ---- HUD (수동 관찰용, 하네스 실행 시에는 hud=0으로 끈다) ----
if (showHud) {
  const hud = document.createElement('div');
  hud.id = 'hud';
  const links = ['static', 'css', 'canvas', 'webgl']
    .map(s => `<a href="?scene=${s}&cap=${cap}">${s}</a>`).join('');
  const caps = [0, 60, 30, 15, 5]
    .map(c => `<a href="?scene=${scene}&cap=${c}">${c || '제한없음'}</a>`).join('');
  hud.innerHTML = `<div>${links}</div><div>cap: ${caps}</div><div id="fps">-</div>`;
  document.addEventListener('DOMContentLoaded', () => document.body.append(hud));
  setInterval(() => {
    document.getElementById('fps').textContent =
      `scene=${scene} cap=${cap || '없음'} | 그린 프레임: ${hudFrames} FPS`;
    hudFrames = 0;
  }, 1000);
}

// ---- 장면 ----
function makeCanvas() {
  const c = document.createElement('canvas');
  const fit = () => { c.width = Math.round(innerWidth * devicePixelRatio); c.height = Math.round(innerHeight * devicePixelRatio); };
  fit();
  addEventListener('resize', fit);
  document.body.append(c);
  return c;
}

const scenes = {
  // 애니메이션이 없는 문서: 브라우저를 띄워 두기만 했을 때의 바닥 전력
  static() {
    const para = '프레임 예산 실험용 정적 문서입니다. 이 장면은 아무것도 움직이지 않으므로 FPS 제한의 영향이 없어야 합니다. ';
    const body = Array.from({ length: 40 }, (_, i) => `<h2>단락 ${i + 1}</h2><p>${para.repeat(6)}</p>`).join('');
    document.body.insertAdjacentHTML('afterbegin', `<div class="static"><h1>Static</h1>${body}</div>`);
  },

  // CSS 애니메이션: rAF와 무관하게 브라우저가 직접 돌린다.
  // 확장 수준(js) 제한은 이 장면을 줄이지 못하는 게 정상이다. 측정용 프로브는 원래 rAF를 쓴다.
  css() {
    const n = Number(P.get('boxes')) || 150;
    const stage = document.createElement('div');
    stage.className = 'stage';
    for (let i = 0; i < n; i++) {
      const b = document.createElement('div');
      b.className = 'box ' + (i % 2 ? 'spin' : 'glow');
      b.style.left = `${rand() * 96}vw`;
      b.style.top = `${rand() * 94}vh`;
      b.style.background = `hsl(${Math.floor(rand() * 360)} 70% 55%)`;
      b.style.animationDelay = `${-rand() * 2}s`;
      stage.append(b);
    }
    document.body.append(stage);
    nativeRAF(function probe(t) { frame(t); nativeRAF(probe); });
  },

  // Canvas 2D 입자: rAF마다 CPU/GPU로 다시 그린다
  canvas() {
    const c = makeCanvas();
    const g = c.getContext('2d');
    const n = Number(P.get('particles')) || 6000;
    const ps = Array.from({ length: n }, () => ({
      x: rand(), y: rand(), r: 20 + rand() * 120, s: 0.3 + rand() * 1.5, ph: rand() * 6.283,
      color: `hsl(${Math.floor(rand() * 360)} 80% 60%)`,
    }));
    requestAnimationFrame(function loop(t) {
      const w = c.width, h = c.height, k = t / 1000;
      g.fillStyle = '#111';
      g.fillRect(0, 0, w, h);
      for (const p of ps) {
        g.fillStyle = p.color;
        g.beginPath();
        g.arc(p.x * w + Math.cos(k * p.s + p.ph) * p.r, p.y * h + Math.sin(k * p.s * 1.3 + p.ph) * p.r, 3, 0, 6.283);
        g.fill();
      }
      frame(t);
      requestAnimationFrame(loop);
    });
  },

  // WebGL 전체 화면 셰이더: 픽셀당 연산량을 iters로 조절하는 GPU 부하
  webgl() {
    const c = makeCanvas();
    const gl = c.getContext('webgl', { antialias: false });
    const iters = Number(P.get('iters')) || 24;
    const vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
    const fs = `precision highp float;
      uniform vec2 res; uniform float t;
      void main(){
        vec2 z = (gl_FragCoord.xy * 2.0 - res) / res.y;
        vec3 col = vec3(0.0);
        for (int i = 0; i < ${iters}; i++) {
          z = abs(z) / dot(z, z) - vec2(0.9 + 0.1 * sin(t * 0.3), 0.6 + 0.05 * cos(t * 0.2));
          col += vec3(0.020, 0.012, 0.030) * exp(-length(z));
        }
        gl_FragColor = vec4(col * 1.5, 1.0);
      }`;
    const prog = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      gl.attachShader(prog, s);
    }
    gl.linkProgram(prog);
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const uRes = gl.getUniformLocation(prog, 'res');
    const uT = gl.getUniformLocation(prog, 't');
    requestAnimationFrame(function loop(t) {
      gl.viewport(0, 0, c.width, c.height);
      gl.uniform2f(uRes, c.width, c.height);
      gl.uniform1f(uT, t / 1000);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      frame(t);
      requestAnimationFrame(loop);
    });
  },
};

(scenes[scene] || scenes.webgl)();
</script>
</body>
</html>
