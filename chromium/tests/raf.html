<!doctype html><title>raf</title><div id=b style="width:100px;height:100px;background:red"></div>
<script>
let n=0;window.counts=[];
function f(){n++;document.getElementById('b').style.transform='translateX('+(n%200)+'px)';requestAnimationFrame(f)}
requestAnimationFrame(f);setInterval(()=>{window.counts.push(n);n=0},1000);
</script>
